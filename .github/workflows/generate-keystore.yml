name: Generate Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate release signing keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Animation Studio, OU=Android, O=Animation Studio, L=Luanda, ST=Luanda, C=AO"

          base64 -w 0 "$RUNNER_TEMP/release.keystore" \
            > "$RUNNER_TEMP/KEYSTORE_BASE64.txt"

          test -s "$RUNNER_TEMP/KEYSTORE_BASE64.txt"

      - name: Upload KEYSTORE_BASE64
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE_BASE64
          path: ${{ runner.temp }}/KEYSTORE_BASE64.txt
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/KEYSTORE_BASE64.txt"
