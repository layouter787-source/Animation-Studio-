name: Android Debug APK

on:
  # Build automatically for every branch, including Claude's working branch.
  push:
    branches:
      - "**"
  # Validate changes proposed for main, including every new commit pushed to the PR.
  pull_request:
    branches:
      - main
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animation-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Release sem assinar: corre antes de existir qualquer keystore no ambiente.
      - name: Build release APK (unsigned)
        run: gradle --no-daemon assembleRelease

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: animation-studio-release-apk-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      # Keystore: usa os segredos do repositorio se existirem (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      # Sem eles, cria uma chave temporaria so para este build (assina e instala, mas a chave muda a cada build,
      # por isso nao da para atualizar por cima de uma instalacao feita com outro build).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD_SECRET" ] && [ -n "$KEY_ALIAS_SECRET" ]; then
            # Decode without adding a newline; tolerate whitespace introduced during secret entry.
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/release.keystore"
            test -s "$RUNNER_TEMP/release.keystore"

            # First validate the file + store password independently from the alias.
            if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                -storepass "$KEYSTORE_PASSWORD_SECRET" > "$RUNNER_TEMP/keystore-list.txt" 2> "$RUNNER_TEMP/keystore-error.txt"; then
              echo "::error::Keystore could not be opened. The decoded file may be invalid, or KEYSTORE_PASSWORD does not match it."
              sed -n '1,3p' "$RUNNER_TEMP/keystore-error.txt"
              exit 1
            fi

            # Get private-key aliases from the validated keystore; never print passwords or encoded data.
            mapfile -t PRIVATE_KEY_ALIASES < <(awk -F, '/PrivateKeyEntry/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1 }' "$RUNNER_TEMP/keystore-list.txt")
            REQUESTED_ALIAS="$(printf '%s' "$KEY_ALIAS_SECRET" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            SELECTED_ALIAS=""

            for candidate in "${PRIVATE_KEY_ALIASES[@]}"; do
              if [ "$candidate" = "$REQUESTED_ALIAS" ] || [ "${candidate,,}" = "${REQUESTED_ALIAS,,}" ]; then
                SELECTED_ALIAS="$candidate"
                break
              fi
            done

            # If the keystore contains exactly one signing key, select it even if KEY_ALIAS has a typo.
            if [ -z "$SELECTED_ALIAS" ] && [ "${#PRIVATE_KEY_ALIASES[@]}" -eq 1 ]; then
              SELECTED_ALIAS="${PRIVATE_KEY_ALIASES[0]}"
              echo "::warning::KEY_ALIAS did not match; using the only private-key alias found in the keystore."
            fi

            if [ -z "$SELECTED_ALIAS" ]; then
              echo "::error::Store password is valid, but KEY_ALIAS does not identify one unique private key."
              echo "Available private-key aliases:"
              printf ' - %s\n' "${PRIVATE_KEY_ALIASES[@]}"
              exit 1
            fi

            # Confirm that the selected alias is usable before handing it to Gradle.
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
              -storepass "$KEYSTORE_PASSWORD_SECRET" -alias "$SELECTED_ALIAS" >/dev/null

            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$SELECTED_ALIAS" >> "$GITHUB_ENV"
            # This keystore was created without a separate key-password prompt.
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "### Assinatura: keystore aberta; alias privado validado" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD_SECRET" ] && [ -z "$KEY_ALIAS_SECRET" ]; then
            # Temporary signing is allowed only when no signing secrets were configured at all.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -alias animationstudio \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass android-temp -keypass android-temp \
              -dname "CN=Animation Studio, O=Animation Studio, C=AO"
            echo "KEYSTORE_PASSWORD=android-temp" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=animationstudio" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android-temp" >> "$GITHUB_ENV"
            echo "### Assinatura: chave TEMPORARIA (nenhum segredo configurado). Muda a cada build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Signing secrets are incomplete. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS together."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK and AAB
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: animation-studio-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: animation-studio-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
          
